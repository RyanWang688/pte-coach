<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>题型指南 · PTE Rise</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<main>
  <h1>22 种题型</h1>
  <div class="row" style="margin-top:12px" id="facts"></div>
  <div class="seg" id="seg"></div>
  <div id="list"></div>
  <p class="small mute center" style="margin-top:20px">题量和时间是大致范围，以 <a href="https://www.pearsonpte.com/pte-academic/test-format" target="_blank" rel="noopener">Pearson 官方说明</a>为准</p>
</main>
<script src="assets/core.js?v=4"></script>
<script src="assets/drag.js?v=5"></script>
<script>
PTE.nav('guide.html');
PTE.track('guide');
document.getElementById('facts').innerHTML = [['clock', '约 2 小时'], ['list', '22 种计分题'], ['spark', '★ = 优先练'], ['target', '一题常计两项分']].map(([i, t]) => `<span class="chip">${PTE.icon(i)} ${t}</span>`).join('');
const S = { speaking: ['口语写作', '#FF6F91', 'mic'], reading: ['阅读', '#5B6CFF', 'eye'], listening: ['听力', '#14B8B0', 'head'], tpl: ['模板', '#FF7A59', 'pen'], method: ['训练方法', '#7C5CFF', 'spark'] };
const T = [
  ['speaking', 'Personal Introduction', '不计分', 1, '准备 25 秒 · 说 30 秒', '会发给院校，准备一段固定的自我介绍'],
  ['speaking', 'Read Aloud · RA', '★', '6–7', '准备 30–40 秒 · 读约 40 秒', '流利度和发音比内容更重要。读错了不要回读'],
  ['speaking', 'Repeat Sentence · RS', '★', '10–12', '答 15 秒', '计入口语和听力两项。按意群记忆，宁漏勿卡'],
  ['speaking', 'Describe Image · DI', '★', '3–4', '准备 25 秒 · 说 40 秒', '套模板：主题 → 关键数据 → 趋势 → 结论'],
  ['speaking', 'Re-tell Lecture · RL', '★', '1–2', '听约 90 秒 · 说 40 秒', '边听边记关键词，套模板串起来'],
  ['speaking', 'Answer Short Question', '', '5–6', '答 10 秒', '用一个词或几个词回答常识问题'],
  ['speaking', 'Summarize Group Discussion', '新', '1–2', '作答约 2 分钟', '话题 → 每个人的观点 → 结论'],
  ['speaking', 'Respond to a Situation', '新', '1–2', '准备约 20 秒 · 说约 40 秒', '礼貌开头 → 说明情况 → 提出方案 → 礼貌结束'],
  ['speaking', 'Summarize Written Text · SWT', '', '1–2', '10 分钟', '只写一句话，5–75 词，只能有一个句号'],
  ['speaking', 'Write Essay · WE', '★', 1, '20 分钟', '200–300 词，4 段：开头、两段主体、结尾'],
  ['reading', 'R&W Fill in the Blanks', '★', '5–6', '', '下拉选词，考搭配和词性，计入阅读和写作两项'],
  ['reading', 'MC, Multiple Answers', '', '1–2', '', '选错会扣分。没把握就只选最确定的一个'],
  ['reading', 'Re-order Paragraphs', '', '2–3', '', '先找首句，再找代词和连接词相互呼应的句对'],
  ['reading', 'Reading Fill in the Blanks', '★', '4–5', '', '拖词填空，先判断词性，再看搭配'],
  ['reading', 'MC, Single Answer', '', '1–2', '', '性价比低，时间不够先放掉'],
  ['listening', 'Summarize Spoken Text · SST', '★', '1–2', '10 分钟', '50–70 词总结，计入听力和写作两项'],
  ['listening', 'MC, Multiple Answers', '', '1–2', '', '选错扣分'],
  ['listening', 'Fill in the Blanks', '', '2–3', '', '边听边填，拼写必须正确'],
  ['listening', 'Highlight Correct Summary', '', '1–2', '', '选出最贴切的总结'],
  ['listening', 'MC, Single Answer', '', '1–2', '', '单选'],
  ['listening', 'Select Missing Word', '', '1–2', '', '根据上下文选出结尾'],
  ['listening', 'Highlight Incorrect Words · HIW', '★', '2–3', '', '用手指着原文跟读，听到不同的词就点击。点错扣分'],
  ['listening', 'Write from Dictation · WFD', '★', '3–4', '', '听写一句话，计入听力和写作两项。拼写决定得分'],
];
const TPL = [
  ['DI 描述图片', 'This <u>bar chart</u> illustrates <u>the number of …</u> from <u>2015 to 2024</u>. The highest figure is <u>…</u>, while the lowest is <u>…</u>. It is evident that <u>X increased steadily</u>. In comparison, <u>Y …</u>. Overall, the chart suggests that <u>…</u>.'],
  ['RL 复述讲座', 'The speaker was talking about <u>topic</u>. Firstly, he mentioned that <u>keyword 1</u>. Then he discussed <u>keyword 2</u> and <u>keyword 3</u>. In addition, <u>keyword 4</u> was highlighted. In conclusion, the lecture emphasised the importance of <u>topic</u>.'],
  ['SGD 小组讨论', 'The discussion was about <u>topic</u>. The first speaker argued that <u>…</u>. However, the second speaker believed <u>…</u>. The third speaker suggested <u>…</u>. Overall, they agreed that <u>…</u>.'],
  ['RTS 情景回应', 'Hi <u>name</u>, this is <u>…</u>. I\'m calling about <u>situation</u>. Unfortunately, <u>problem</u>. I was wondering if we could <u>solution A</u>, or alternatively <u>solution B</u>. Please let me know what works best for you. Thanks so much.'],
  ['SWT 一句话概括', '<u>Main idea</u>, and although <u>point 1</u>, <u>point 2</u>, which <u>implication</u>.'],
  ['SST 讲座总结', 'The speaker discussed <u>topic</u>. He first explained that <u>point 1</u>. Moreover, <u>point 2</u>. Finally, he concluded that <u>point 3</u>.'],
  ['WE 议论文结构', '<b>开头</b>：背景 + 改写题目 + 表明立场<br><b>主体 1</b>：观点 → 解释 → For example …<br><b>主体 2</b>：另一面 → However …<br><b>结尾</b>：In conclusion, … 重申立场'],
];
let cur = (location.hash || '#speaking').slice(1); if (!S[cur]) cur = 'speaking';
const seg = document.getElementById('seg'), list = document.getElementById('list');
const render = () => {
  seg.innerHTML = Object.entries(S).map(([k, [n, c, i]]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${PTE.icon(i)} ${n}</button>`).join('');
  seg.querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.k; history.replaceState(null, '', '#' + cur); render(); });
  const [, color, icon] = S[cur];
  if (cur === 'tpl') {
    list.innerHTML = TPL.map(([t, b], i) => `<details class="tpl fadein" ${i === 0 ? 'open' : ''}><summary><span class="chip" style="background:${color};color:#fff">${PTE.icon('pen')}</span>${t}</summary><div class="body"><div class="tplt">${b}</div><div class="small mute" style="margin-top:6px">黄色部分换成题目里的内容</div></div></details>`).join('');
  } else if (cur === 'method') {
    PTE.load('data/plan.json').then(p => {
      list.innerHTML = p.principles.map(([a, b], i) => `<div class="card tcard fadein" style="animation-delay:${i * 50}ms"><div class="ic" style="background:${['#6C5CFF', '#FF6F91', '#3BA9FF', '#21C38E', '#FFB020', '#FF7A59'][i % 6]}">${PTE.icon(['redo', 'clock', 'book', 'list', 'target', 'chart'][i % 6])}</div><div><div class="nm">${a}</div><div class="small mute">${PTE.esc(b)}</div></div></div>`).join('');
    });
  } else {
    list.innerHTML = T.filter(t => t[0] === cur).map(([, nm, tag, n, time, how], i) => `<div class="card tcard fadein" style="animation-delay:${i * 40}ms"><div class="ic" style="background:${tag === '★' ? color : 'var(--line)'};color:${tag === '★' ? '#fff' : 'var(--mute)'}">${PTE.icon(tag === '★' ? 'spark' : icon)}</div>
      <div class="grow"><div class="nm">${nm}</div><div class="tags">${tag === '★' ? '<span class="chip star">★ 高分重点</span>' : tag ? `<span class="chip">${tag}</span>` : ''}<span class="chip">${n} 题</span>${time ? `<span class="chip">${PTE.icon('clock')} ${time}</span>` : ''}</div><div class="small">${how}</div></div></div>`).join('');
  }
};
render();
</script>
</body>
</html>
