<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生词本 · PTE Rise</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=11">
</head>
<body>
<main>
  <div class="pagehead"><div class="grow"><div class="eyebrow">Wordbook · Spaced repetition</div><h1 style="margin-top:10px">生词本</h1><p>按遗忘曲线安排复习，每次换一种题型考你，直到真正记住。</p></div></div>
  <a class="cta" href="review.html" id="go" style="margin-bottom:24px"></a>

  <div class="wbgrid">
    <div>
      <div class="card">
        <div class="row"><b class="grow" style="font:600 1.1rem var(--serif)">今日记忆报告</b><span class="small mute" id="total"></span></div>
        <div class="stack" id="stack" style="margin-top:14px"></div>
        <div class="legend" id="legend"></div>
        <div class="stats" id="kpi" style="grid-template-columns:1fr 1fr;margin-top:18px"></div>
        <div id="types" class="row" style="margin-top:14px"></div>
        <p class="small" id="insight" style="margin:14px 0 0;line-height:1.8;color:var(--ink2)"></p>
      </div>
      <div class="card" style="margin-top:16px">
        <b style="font:600 1.1rem var(--serif)">未来 7 天到期</b>
        <div class="bars" id="bars" style="margin-top:14px"></div>
      </div>
      <details class="tpl" style="margin-top:16px"><summary></summary><div class="body" id="curve"></div></details>
    </div>
    <div>
      <div class="seg" id="tabs" style="margin-top:0"></div>
      <div class="card" id="list" style="margin-top:0"></div>
    </div>
  </div>
</main>
<script src="assets/core.js?v=11"></script>
<script src="assets/lookup.js?v=11"></script>
<script>
PTE.nav('words.html');
PTE.track('words');
const $ = (s) => document.querySelector(s);
const TN = { spell: '拼写', meaning: '听音辨义', cloze: '例句填空', dictation: '例句听写', recognize: '看词选义' };
const rel = (d) => { const n = Math.round((new Date(d) - new Date(PTE.today())) / 864e5); return n <= 0 ? '今天' : n === 1 ? '明天' : n + ' 天后'; };
let tab = PTE.get('wbTab', 'star');
(async () => {
  const wmap = await PTE.words();
  const custom = PTE.get('custom', {});
  const render = () => {
    const s = PTE.srs(); const keys = Object.keys(s); const t = PTE.today();
    const due = PTE.due();
    $('#go').innerHTML = `<span class="ic">${PTE.icon('redo')}</span><span class="grow"><b style="display:block;font-size:1.05rem">${due.length ? `开始今日复习 · ${due.length} 个到期` : '今天没有到期的词'}</b><span class="small" style="opacity:.75">每个词按记忆曲线换题型考：拼写 / 听音辨义 / 例句填空 / 听写 / 看词选义</span></span>${PTE.icon('arrow')}`;

    const counts = [0, 0, 0, 0]; keys.forEach(k => counts[PTE.stageOf(s[k].box)]++);
    $('#total').textContent = `共 ${keys.length} 词 · 收藏 ${keys.filter(k => s[k].star).length}`;
    $('#stack').innerHTML = PTE.STAGES.map(([, c], j) => `<i style="width:${keys.length ? counts[j] / keys.length * 100 : 0}%;background:${c}"></i>`).join('');
    $('#legend').innerHTML = PTE.STAGES.map(([n, c], j) => `<span><i style="background:${c}"></i>${n} ${counts[j]}</span>`).join('');

    const st = PTE.stats(); const done = st.review.ok + st.review.bad;
    const avgR = keys.length ? keys.reduce((a, k) => a + PTE.retention(s[k]), 0) / keys.length : 0;
    const weak = keys.filter(k => PTE.retention(s[k]) < 0.6);
    $('#kpi').innerHTML = [
      ['check', '#3C8A63', done ? Math.round(st.review.ok / done * 100) + '%' : '—', `今日正确率（${st.review.ok}/${done}）`],
      ['trophy', '#C8963A', counts[3], '已掌握'],
      ['spark', '#2E4A7A', Math.round(avgR * 100) + '%', '平均记忆强度'],
      ['flag', '#C46E55', weak.length, '快要忘记'],
    ].map(([ic, c, v, l]) => `<div class="stat"><span class="ic" style="background:${c}">${PTE.icon(ic)}</span><div><b>${v}</b><span>${l}</span></div></div>`).join('');
    const types = st.review.types || {};
    $('#types').innerHTML = Object.keys(types).length ? Object.entries(types).map(([k, [a, b]]) => `<span class="chip">${TN[k] || k} ${a}/${a + b}</span>`).join('') : '<span class="small mute">今天还没有复习记录</span>';
    const worst = Object.entries(types).filter(([, [a, b]]) => a + b >= 3).sort((x, y) => x[1][0] / (x[1][0] + x[1][1]) - y[1][0] / (y[1][0] + y[1][1]))[0];
    $('#insight').innerHTML = [
      weak.length ? `${PTE.icon('flag')} 按遗忘曲线估算，<b>${weak.length}</b> 个词的记忆强度已低于 60%，它们到期时会优先出现。` : '',
      worst ? `${PTE.icon('target')} 今天最弱的题型是「${TN[worst[0]]}」，可以多做几轮“错词强化”。` : '',
      counts[3] ? `${PTE.icon('trophy')} 已经有 ${counts[3]} 个词撑过了 15 天以上的间隔，算真正记住了。` : `${PTE.icon('spark')} 一个词连续答对 5 次，间隔会拉长到 1→2→4→7→15 天，撑过这些间隔就算“已掌握”。`,
    ].filter(Boolean).join('<br>');

    const days = Array.from({ length: 7 }, (_, j) => PTE.addDays(t, j));
    const dc = days.map((d, j) => keys.filter(k => j === 0 ? s[k].due <= d : s[k].due === d).length);
    const mx = Math.max(1, ...dc);
    $('#bars').innerHTML = dc.map((n, j) => `<div><span>${n}</span><b style="height:${n / mx * 70}%"></b>${j === 0 ? '今天' : ['日', '一', '二', '三', '四', '五', '六'][new Date(days[j]).getDay()]}</div>`).join('');

    const TABS = { star: ['我收藏的', 'cards'], weak: ['快要忘记', 'flag'], all: ['全部', 'list'], master: ['已掌握', 'trophy'] };
    $('#tabs').innerHTML = Object.entries(TABS).map(([k, [n, i]]) => `<button class="${k === tab ? 'on' : ''}" data-k="${k}">${PTE.icon(i)} ${n}</button>`).join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.k; PTE.set('wbTab', tab); render(); });
    let list = keys;
    if (tab === 'star') list = keys.filter(k => s[k].star);
    if (tab === 'weak') list = weak;
    if (tab === 'master') list = keys.filter(k => PTE.stageOf(s[k].box) === 3);
    list.sort((a, b) => PTE.retention(s[a]) - PTE.retention(s[b]));
    $('#list').innerHTML = list.length ? list.map(k => {
      const it = s[k], R = PTE.retention(it), stg = PTE.STAGES[PTE.stageOf(it.box)];
      const mean = wmap[k] ? wmap[k].t.split('；')[0] : (custom[k] && custom[k].def) || '';
      const hist = (it.hist || []).slice(-6).map(h => `<i style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:2px;background:${h[2] ? 'var(--ok)' : 'var(--bad)'}" title="${h[0]} ${TN[h[1]] || h[1]}"></i>`).join('');
      return `<div class="wrow"><div class="grow" style="min-width:0"><b class="w" data-word="${PTE.esc(wmap[k] ? wmap[k].w : k)}" style="cursor:pointer">${PTE.esc(wmap[k] ? wmap[k].w : k)}</b> ${it.star ? `<span style="color:var(--sun)">${PTE.icon('spark')}</span>` : ''}<div class="small mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${PTE.esc(mean)}</div><div>${hist}</div></div>
        <div style="text-align:right"><span class="chip" style="color:${stg[1]}">${stg[0]}</span><div class="small mute" style="margin-top:4px">${rel(it.due)}复习</div></div>
        <div class="str" title="记忆强度 ${Math.round(R * 100)}%"><i style="width:${R * 100}%;background:${R > .8 ? 'var(--ok)' : R > .6 ? 'var(--sun)' : 'var(--coral)'}"></i></div>
        ${it.star ? `<button class="sm round ghost" data-un="${k}" aria-label="移出收藏">${PTE.icon('x')}</button>` : ''}</div>`;
    }).join('') : `<p class="center mute" style="padding:20px 0">${tab === 'star' ? (matchMedia('(min-width:1024px)').matches ? '还没有收藏生词。<br>在阅读或训练里，按住不认识的单词，拖到左侧的「生词本」即可收藏。' : '还没有收藏生词。<br>在阅读或训练里，长按不认识的单词，拖到右下角的生词本按钮。') : '暂时没有'}</p>`;
    $('#list').querySelectorAll('[data-word]').forEach(b => b.onclick = () => PTE.lookup(b.dataset.word));
    $('#list').querySelectorAll('[data-un]').forEach(b => b.onclick = () => { const s2 = PTE.srs(); delete s2[b.dataset.un].star; PTE.set('srs', s2); render(); });
  };
  render();

  // forgetting-curve explainer
  document.querySelector('details.tpl summary').innerHTML = `<span class="chip" style="background:var(--grad);color:#fff">${PTE.icon('chart')}</span>为什么这样安排复习？（遗忘曲线）`;
  const W = 320, H = 150, days = 30, curves = [[1.2, '新学', '#C46E55'], [2.5, '短期记忆', '#C8963A'], [9, '巩固中', '#4F7CAC'], [35, '已掌握', '#3C8A63']];
  const path = (S) => Array.from({ length: 61 }, (_, j) => { const x = j / 60 * days; return `${j ? 'L' : 'M'}${(x / days * (W - 30) + 30).toFixed(1)},${(10 + (1 - Math.exp(-x / S)) * (H - 30)).toFixed(1)}`; }).join('');
  $('#curve').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="30" y1="${H - 20}" x2="${W}" y2="${H - 20}" stroke="var(--line)"/><line x1="30" y1="10" x2="30" y2="${H - 20}" stroke="var(--line)"/>
    <text x="0" y="16" font-size="9" fill="var(--mute)">100%</text><text x="6" y="${H - 22}" font-size="9" fill="var(--mute)">0%</text><text x="${W - 40}" y="${H - 6}" font-size="9" fill="var(--mute)">30 天</text>
    ${curves.map(([S, , c]) => `<path d="${path(S)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`).join('')}</svg>
    <div class="legend">${curves.map(([, n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>
    <p class="small mute">每条线表示不复习时，记忆会怎样衰减。每次在快忘的时候答对一次，曲线就会变平一些（记得更久），所以复习间隔会按 1→2→4→7→15→30 天拉长。答错就回到第 1 天。同一个词每次换一种题型考，避免只是“认得这道题”，而是真的会用。</p>`;
})();
</script>
</body>
</html>
