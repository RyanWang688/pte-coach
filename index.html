<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PTE Rise</title>
<meta name="theme-color" content="#F6F1E8">
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=14">
</head>
<body>
<main>
  <div class="dash">
    <section>
      <header class="hero">
        <div class="eyebrow" id="kicker"></div>
        <h1 id="title" style="margin-top:10px">…</h1>
        <div class="sub" id="sub"></div>
      </header>
      <div class="row" style="margin:32px 0 12px"><h2 class="grow" style="margin:0">今日任务</h2><span class="small mute" id="taskCount"></span></div>
      <div class="prog" style="margin-bottom:16px"><i id="taskBar" style="width:0"></i></div>
      <div class="quest" id="quest"></div>
      <div class="row" style="margin-top:16px"><button class="ghost sm" id="settings"></button><span class="grow"></span><span class="small mute">点任务展开说明 · 点左侧图标标记完成</span></div>
    </section>
    <aside>
      <div class="card progcard" id="prog"></div>
      <button class="cta" id="finish">
        <span class="ic"></span>
        <span class="grow"><b style="display:block;font-size:1rem">完成今天，交作业</b><span class="small" style="opacity:.7">生成汇报，复制发给教练</span></span>
        <span class="arrow"></span>
      </button>
      <div class="card"><div class="coach"><img src="assets/logo.svg" alt=""><div><div class="eyebrow" style="margin-bottom:8px">教练寄语</div><div class="bubble" id="coach"></div></div></div></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">60 天路线</div><div class="steps" id="steps"></div></div>
    </aside>
  </div>
</main>
<script src="assets/core.js?v=14"></script>
<script src="assets/drag.js?v=14"></script>
<script>
PTE.nav('index.html');
PTE.track('dashboard');
const $ = (s) => document.querySelector(s);
$('#finish .ic').innerHTML = PTE.icon('trophy'); $('#finish .arrow').innerHTML = PTE.icon('arrow');
$('#settings').innerHTML = PTE.icon('gear') + ' 备份与往日任务';
(async () => {
  const [day, plan] = await Promise.all([PTE.currentDay(), PTE.load('data/plan.json'), PTE.words()]);
  const doneKey = 'done:' + day.day;
  let done = PTE.get(doneKey, []);
  let open = -1;
  const ph = plan.phases.find(p => p.n === day.phase);
  const hr = new Date().getHours();
  $('#kicker').textContent = `Day ${day.day} of ${plan.totalDays} · 阶段 ${ph.n} · ${ph.name}` + (day.day !== day.latest ? ' · 往日' : '');
  $('#title').textContent = day.title.replace(/^第 ?\d+ ?天[：:]\s*/, '');
  const totalMin = day.tasks.reduce((a, k) => a + k.mins, 0);

  const learned = Object.keys(PTE.srs()).length;
  const mins = Math.round(Object.values(PTE.stats().mins).reduce((a, b) => a + b, 0));
  const streak = PTE.streak(); const due = PTE.due().length;
  $('#prog').innerHTML = `<div class="big">${PTE.ring(day.day / plan.totalDays, 84, 8, `<span style="font:600 1.15rem var(--serif)">${day.day}</span>`)}
      <div><div class="eyebrow">总进度</div><div style="font:600 1.3rem/1.3 var(--serif);margin-top:6px">第 ${day.day} 天 / 共 ${plan.totalDays} 天</div><div class="small mute">${ph.name} · Day ${ph.days[0]}–${ph.days[1]}</div></div></div>
    <div class="mini">
      <div><b>${mins}<span class="small mute" style="font-family:var(--sans)"> / 240</span></b><span>今日学习（分钟）</span></div>
      <div><b>${learned}<span class="small mute" style="font-family:var(--sans)"> / 1040</span></b><span>已学单词</span></div>
      <div><b style="color:${due ? 'var(--acc)' : 'inherit'}">${due}</b><span>今日到期复习</span></div>
      <div><b>${streak}</b><span>连续打卡（天）</span></div>
    </div>`;
  PTE.animateRings();

  $('#coach').textContent = day.coachNote;

  const render = () => {
    const nextIdx = day.tasks.findIndex((k, i) => !done.includes(i) && k.mod !== 'break');
    let t = 0;
    $('#quest').innerHTML = day.tasks.map((k, i) => {
      const m = PTE.MOD[k.mod] || PTE.MOD.guide;
      const start = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; t += k.mins;
      const cls = ['qitem', done.includes(i) ? 'done' : '', i === nextIdx ? 'next' : '', i === open ? 'open' : ''].join(' ');
      return `<div class="${cls}" data-i="${i}" data-open>
        <div class="rail"><span class="time">${start}</span><div class="node" style="background:${m.c}" data-tog title="${done.includes(i) ? '撤销完成' : '标记完成'}">${PTE.icon(m.ic)}<span class="check">${PTE.icon('check')}</span></div></div>
        <div class="qcard"><div class="qtitle">${PTE.esc(k.title)}${i === nextIdx ? '<span class="nexttag">下一步</span>' : ''}</div>
          <div class="qmeta">${k.mins} 分钟 · ${m.n}</div>
          <div class="qmore"><div style="padding-top:10px;line-height:1.7">${PTE.esc(k.detail || '')}</div>
            <div class="qact">${k.link ? `<a class="btn pri sm" href="${k.link}">开始 ${PTE.icon('arrow')}</a>` : ''}<button class="sm ghost" data-tog>${done.includes(i) ? '撤销完成' : PTE.icon('check') + ' 标记完成'}</button></div></div>
        </div>
        ${k.link ? `<a class="go" href="${k.link}" aria-label="开始" data-go>${PTE.icon('arrow')}</a>` : '<span class="go"></span>'}</div>`;
    }).join('');
    $('#taskCount').textContent = `已完成 ${done.length} / ${day.tasks.length}`;
    $('#taskBar').style.width = (done.length / day.tasks.length * 100) + '%';
    $('#sub').textContent = `${day.tasks.length} 项任务 · 约 ${Math.round(totalMin / 6) / 10} 小时 · ${done.length === day.tasks.length ? '今天全部完成 ✓' : hr < 12 ? '早上好，从第一项开始吧' : hr < 18 ? '下午好，继续保持' : '晚上好，完成后记得交作业'}`;
    document.querySelectorAll('.qitem').forEach(el => {
      const i = +el.dataset.i;
      el.querySelectorAll('[data-tog]').forEach(b => b.onclick = (e) => {
        e.stopPropagation();
        const was = done.includes(i);
        done = was ? done.filter(x => x !== i) : [...done, i];
        PTE.set(doneKey, done);
        if (!was && done.length === day.tasks.length) { PTE.confetti(); PTE.toast('今天全部完成！记得交作业'); }
        render();
      });
      el.querySelectorAll('[data-go], .qact a').forEach(a => a.onclick = (e) => e.stopPropagation());
      el.onclick = () => { open = open === i ? -1 : i; render(); };
    });
  };
  render();

  $('#steps').innerHTML = plan.phases.map(p => {
    const pct = Math.max(0, Math.min(1, (day.day - p.days[0] + 1) / (p.days[1] - p.days[0] + 1)));
    const cls = p.n === day.phase ? ' on' : day.day > p.days[1] ? ' past' : '';
    return `<div class="stepc${cls}"><span class="dotn">${day.day > p.days[1] ? PTE.icon('check') : p.n}</span><div><b>${p.name} <span class="mute small" style="font-weight:400">Day ${p.days[0]}–${p.days[1]}</span></b><div class="small mute">${PTE.esc(p.goal.split('；')[0])}</div>${p.n === day.phase ? `<div class="barx"><i style="width:${pct * 100}%"></i></div>` : ''}</div></div>`;
  }).join('');

  /* ---------- report sheet ---------- */
  $('#finish').onclick = () => {
    const s = PTE.stats();
    const tracked = Math.round(Object.values(s.mins).reduce((a, b) => a + b, 0));
    const stuck = ['RS 记不住', 'WFD 拼写错', 'RA 卡顿', '单词记不住', '听不懂', '写作没思路', '时间不够'];
    const sh = PTE.sheet(`<h2 style="margin-top:0">今天怎么样？</h2>
      <div class="small mute">学习时长（网站记录到 ${tracked} 分钟）</div>
      <div class="row"><input type="range" id="hrs" min="0" max="6" step="0.5" value="${Math.min(6, Math.round(tracked / 30) / 2) || 4}" class="grow"><b id="hrsV"></b></div>
      <div class="small mute" style="margin-top:12px">状态</div>
      <div class="choice" id="mood">${['轻松', '还行', '有点累', '很吃力'].map(x => `<button class="mood sm">${x}</button>`).join('')}</div>
      <div class="small mute" style="margin-top:12px">卡在哪里（可多选）</div>
      <div class="choice" id="stuck">${stuck.map(x => `<button class="sm">${x}</button>`).join('')}</div>
      <input type="text" id="other" placeholder="补充：模考分数 / 目标分 / 考试日期…" style="margin-top:12px">
      <button class="pri lg" id="gen" style="width:100%;margin-top:16px">${PTE.icon('spark')} 生成汇报</button>
      <pre class="report hidden" id="out"></pre>
      <button class="lg hidden" id="copy" style="width:100%;margin-top:10px">${PTE.icon('copy')} 复制，发给教练</button>`);
    const hrs = sh.querySelector('#hrs'), hv = sh.querySelector('#hrsV');
    const upd = () => hv.textContent = hrs.value + ' 小时'; hrs.oninput = upd; upd();
    sh.querySelectorAll('#mood button').forEach(b => b.onclick = () => { sh.querySelectorAll('#mood button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
    sh.querySelectorAll('#stuck button').forEach(b => b.onclick = () => b.classList.toggle('on'));
    sh.querySelector('#gen').onclick = () => {
      const avg = (arr) => arr.length ? Math.round(arr.reduce((a, x) => a + x.score / x.total, 0) / arr.length * 100) : null;
      const low = (arr) => arr.slice().sort((a, b) => a.score / a.total - b.score / b.total).slice(0, 3).map(x => `「${x.text}」→「${x.answer || '(空)'}」${x.score}/${x.total}`).join('\n    ');
      const notDone = day.tasks.map((k, i) => done.includes(i) ? null : k.title).filter(Boolean);
      const srs = PTE.srs();
      const L = [];
      L.push(`【PTE 日报】Day ${day.day} · ${PTE.today()}`);
      L.push(`时长：自报 ${hrs.value} 小时；网站记录 ${tracked} 分钟（${Object.entries(s.mins).map(([k, v]) => `${k} ${Math.round(v)}`).join(' / ') || '无'}）`);
      L.push(`状态：${(sh.querySelector('#mood .on') || {}).textContent || '未选'}；卡点：${[...sh.querySelectorAll('#stuck .on')].map(b => b.textContent).join('、') || '无'}`);
      L.push(`任务：${done.length}/${day.tasks.length}` + (notDone.length ? `（未完成：${notDone.join('、')}）` : ''));
      L.push(`单词：新学 ${s.newWords.length}；默写 ${s.review.ok} 对 / ${s.review.bad} 错；累计 ${Object.keys(srs).length}；明日到期 ${Object.values(srs).filter(x => x.due <= PTE.addDays(PTE.today(), 1)).length}` + (s.review.wrong.length ? `\n  默写错词：${s.review.wrong.join(', ')}` : ''));
      const cnt = [0, 0, 0, 0]; Object.values(srs).forEach(x => cnt[PTE.stageOf(x.box)]++);
      const TN = { spell: '拼写', meaning: '听音辨义', cloze: '例句填空', dictation: '例句听写', recognize: '看词选义' };
      L.push(`记忆：${PTE.STAGES.map(([n], j) => `${n} ${cnt[j]}`).join(' / ')}；收藏生词 ${Object.values(srs).filter(x => x.star).length}；快要忘记(<60%) ${Object.values(srs).filter(x => PTE.retention(x) < 0.6).length}` + (s.review.types ? `\n  题型正确率：${Object.entries(s.review.types).map(([k, [a, b]]) => `${TN[k] || k} ${a}/${a + b}`).join('，')}` : ''));
      const newStar = Object.entries(srs).filter(([, x]) => x.star && x.first === PTE.today()).map(([k]) => k);
      if (newStar.length) L.push(`  今日新收藏：${newStar.join(', ')}`);
      L.push(`阅读：理解 ${s.mcq.ok}/${s.mcq.ok + s.mcq.bad}；填空 ${s.cloze.ok}/${s.cloze.ok + s.cloze.bad}` + (s.cloze.wrong.length ? `；填错：${s.cloze.wrong.join(', ')}` : ''));
      L.push(`WFD：${s.wfd.length} 句` + (s.wfd.length ? `，平均 ${avg(s.wfd)}%\n  最弱：\n    ${low(s.wfd)}` : ''));
      L.push(`RS：${s.rs.length} 句` + (s.rs.length ? `，平均 ${avg(s.rs)}%\n  最弱：\n    ${low(s.rs)}` : ''));
      L.push(`RA：${s.ra.length} 段` + (s.ra.length ? `，平均识别 ${avg(s.ra)}%` : ''));
      if (s.bank && Object.keys(s.bank).length) L.push(`题库：${Object.entries(s.bank).map(([k, [n, a, b]]) => `${k.toUpperCase()} ${n} 题 ${b ? Math.round(a / b * 100) : 0}%`).join('，')}`);
      s.writing.forEach(w => L.push(`写作 ${w.type}（${w.words} 词，${w.mins} 分钟）：\n${w.text}`));
      const o = sh.querySelector('#other').value; if (o) L.push(`补充：${o}`);
      const out = sh.querySelector('#out'); out.textContent = L.join('\n'); out.classList.remove('hidden');
      sh.querySelector('#copy').classList.remove('hidden'); sh.querySelector('#gen').classList.add('hidden');
    };
    sh.querySelector('#copy').onclick = async () => {
      try { await navigator.clipboard.writeText(sh.querySelector('#out').textContent); PTE.toast('已复制，发给教练吧'); PTE.confetti(); }
      catch (e) { const r = document.createRange(); r.selectNode(sh.querySelector('#out')); getSelection().removeAllRanges(); getSelection().addRange(r); PTE.toast('已选中，请手动复制'); }
    };
  };

  /* ---------- settings sheet ---------- */
  const idx = await PTE.load('data/days/index.json');
  $('#settings').onclick = () => {
    const sh = PTE.sheet(`<h2 style="margin-top:0">设置</h2>
      <p class="small mute">学习记录只保存在这台设备的浏览器里。换设备前先导出，到新设备上再导入。</p>
      <div class="row"><button id="exp">${PTE.icon('copy')} 导出备份</button><label class="btn">${PTE.icon('plus')} 导入备份<input type="file" id="imp" accept=".json" hidden></label></div>
      <p class="small mute" style="margin-top:18px">查看往日任务</p>
      <div class="choice">${idx.days.map(n => `<button class="sm${n === day.day ? ' on' : ''}" data-d="${n}">Day ${n}</button>`).join('')}</div>`);
    sh.querySelector('#exp').onclick = () => {
      const dump = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('pte:')) dump[k] = localStorage.getItem(k); }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(dump)], { type: 'application/json' })); a.download = `pte-backup-${PTE.today()}.json`; a.click();
    };
    sh.querySelector('#imp').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); Object.entries(d).forEach(([k, v]) => { if (k.startsWith('pte:')) localStorage.setItem(k, v); }); PTE.toast('已导入'); setTimeout(() => location.reload(), 800); } catch (err) { PTE.toast('文件格式不对'); }
    };
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { PTE.set('viewDay', +b.dataset.d === idx.current ? null : +b.dataset.d); location.reload(); });
  };
})().catch(e => { document.querySelector('main').insertAdjacentHTML('afterbegin', `<p class="bad">加载失败：${PTE.esc(e.message)}</p>`); });
</script>
</body>
</html>
