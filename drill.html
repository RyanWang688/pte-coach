<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>题型训练 · PTE Rise</title>
<link rel="icon" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
<main>
  <div class="row"><h1 class="grow">题型训练</h1><button class="round ghost" id="cfg" aria-label="发音设置"></button></div>
  <div class="seg" id="tabs"></div>
  <div id="pane"></div>
</main>
<script src="assets/core.js?v=6"></script>
<script src="assets/drag.js?v=6"></script>
<script src="assets/lookup.js?v=6"></script>
<script>
PTE.nav('drill.html');
const TABS = { rs: ['RS 复述', 'mic'], wfd: ['WFD 听写', 'head'], ra: ['RA 朗读', 'book'], write: ['写作', 'pen'] };
const TIPS = {
  rs: ['听完立刻开口，3 秒不说话麦克风会关', '按意群记忆，不要逐词记', '宁可漏词，也要保持流畅'],
  wfd: ['考试只播一次，练习可以重听一次', '先写下记住的骨架，再补细节', '注意复数 -s、过去式 -ed 和冠词'],
  ra: ['流利度和发音比读对每个词更重要', '读错了不要回头重读', '在逗号和意群处自然停顿'],
};
let cur = (location.hash || '#rs').slice(1); if (!TABS[cur]) cur = 'rs';
const shuffle = (a) => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
const plain = (s) => s.replace(/\{\{([^}|]+)(?:\|[^}]+)?\}\}/g, '$1');
const diffHTML = (r) => '<div class="diff" style="font-size:1.1rem;line-height:2">' + r.words.map((w, i) => `<span class="${r.marks[i] ? 'm' : 'x'}">${PTE.esc(w)}</span>`).join(' ') + '</div>';
const $ = (s) => document.querySelector(s);
let day, wmap, pool, paras;
document.getElementById('cfg').innerHTML = PTE.icon('gear');

(async () => {
  [day, wmap] = await Promise.all([PTE.currentDay(), PTE.words()]);
  const arts = await PTE.load('data/articles/' + day.articles + '.json');
  paras = arts.flatMap(a => a.paras.map(p => ({ title: a.title, text: plain(p) })));
  const today = PTE._wlist.slice(day.newWords[0], day.newWords[1]);
  const learned = Object.keys(PTE.srs()).map(k => wmap[k]).filter(Boolean).filter(w => !today.includes(w));
  pool = [...shuffle(today), ...shuffle(learned)].map(w => ({ text: w.e, cn: w.c, word: w.w }));
  render();
})();

PTE.track(() => cur);
function render() {
  $('#tabs').innerHTML = Object.entries(TABS).map(([k, [v, i]]) => `<button data-t="${k}" class="${k === cur ? 'on' : ''}">${PTE.icon(i)} ${v}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { cur = b.dataset.t; history.replaceState(null, '', '#' + cur); speechSynthesis.cancel(); PTE._stopListen && PTE._stopListen(); render(); });
  ({ wfd, rs, ra, write })[cur]($('#pane'));
}
const dots = (key, goal) => { const n = PTE.stats()[key].length; return `<div class="counter" title="今日 ${n} / ${goal}">${Array.from({ length: goal }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div><div class="small mute" style="margin-top:-12px">今日 ${n} / ${goal}${n >= goal ? ' · 目标达成 🎉' : ''}</div>`; };
const tips = (k) => `<span class="tip" data-tips>${PTE.icon('spark')} 技巧</span><div class="hidden why" data-tipbox style="text-align:left;margin-top:10px">${TIPS[k].map(t => '• ' + t).join('<br>')}</div>`;
const wireTips = (el) => { const t = el.querySelector('[data-tips]'); if (t) t.onclick = () => el.querySelector('[data-tipbox]').classList.toggle('hidden'); };
const scoreBlock = (r, extra) => { const pct = r.score / r.total; const html = `<div class="pulse-in"><div class="scorering">${PTE.ring(pct, 88, 8, Math.round(pct * 100) + '%')}</div>${diffHTML(r)}${extra || ''}</div>`; return html; };
const paint = (el, pct) => { el.querySelectorAll('.scorering .fg').forEach(f => f.style.stroke = pct >= .8 ? 'var(--ok)' : pct >= .5 ? 'var(--sun)' : 'var(--coral)'); PTE.animateRings(el); if (pct === 1) PTE.confetti(); };
const goalCheck = (key, goal) => { if (PTE.stats()[key].length === goal) { PTE.confetti(); PTE.toast('今日目标达成！'); } };

/* ---------- WFD ---------- */
function wfd(el) {
  let i = PTE.stats().wfd.length % Math.max(pool.length, 1), plays = 0;
  const show = () => {
    const it = pool[i % pool.length]; plays = 0;
    el.innerHTML = `<div class="card stage">${dots('wfd', day.drills.wfd)}
      <button class="bigbtn" id="play" aria-label="播放">${PTE.icon('play')}</button>
      <div class="status" id="pc">点击播放</div>
      <textarea id="ans" style="min-height:80px;margin-top:14px;text-align:center;font-size:1.1rem" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="写下你听到的句子，回车提交"></textarea>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="pri" id="sub">${PTE.icon('check')} 提交</button><button class="pri hidden" id="next">下一句 ${PTE.icon('arrow')}</button></div>
      <div id="fb" style="margin-top:16px"></div><div style="margin-top:14px">${tips('wfd')}</div></div>`;
    wireTips(el);
    const play = async () => {
      if (plays >= 2) return; plays++;
      const b = $('#play'); b.disabled = true; $('#pc').textContent = '播放中…';
      await PTE.speak(it.text);
      b.disabled = plays >= 2; $('#pc').textContent = plays === 1 ? '还能重听 1 次' : '不能再听了'; $('#ans').focus();
    };
    $('#play').onclick = play;
    $('#sub').onclick = () => {
      const a = $('#ans').value; const r = PTE.wordScore(it.text, a);
      PTE.updateStats(s => s.wfd.push({ text: it.text, answer: a.trim(), score: r.score, total: r.total }));
      $('#fb').innerHTML = scoreBlock(r, `<p class="small mute">${PTE.esc(it.cn)}</p><button class="sm" id="again">${PTE.icon('vol')} 再听原句</button>`);
      paint(el, r.score / r.total);
      $('#again').onclick = () => PTE.speak(it.text);
      PTE.clickable($('#fb .diff'));
      $('#sub').classList.add('hidden'); $('#next').classList.remove('hidden'); $('#next').focus();
      goalCheck('wfd', day.drills.wfd);
    };
    $('#next').onclick = () => { i++; show(); };
    $('#ans').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('#sub').classList.contains('hidden')) $('#sub').click(); else $('#next').click(); } };
  };
  show();
}

/* ---------- RS ---------- */
function rs(el) {
  let i = (PTE.stats().rs.length + 7) % Math.max(pool.length, 1);
  const show = () => {
    const it = pool[i % pool.length];
    el.innerHTML = `<div class="card stage">${dots('rs', day.drills.rs)}
      <button class="bigbtn" id="go" aria-label="开始">${PTE.icon('play')}</button>
      <div class="status" id="st">点击开始：先听，再复述</div>
      <div id="live" class="mute" style="min-height:1.6em;margin-top:6px"></div>
      <div id="fb"></div><div style="margin-top:14px">${tips('rs')}</div></div>`;
    wireTips(el);
    $('#go').onclick = async () => {
      const b = $('#go'); b.disabled = true;
      $('#st').textContent = '仔细听…'; b.innerHTML = PTE.icon('head');
      await PTE.speak(it.text);
      if (PTE.canRecognize) {
        b.classList.add('rec'); b.innerHTML = PTE.icon('mic'); $('#st').innerHTML = '<span class="bad">录音中，开始复述</span>';
        const said = await PTE.listen(15000, t => $('#live').textContent = t);
        b.classList.remove('rec'); b.disabled = false;
        finish(it, said || '');
      } else {
        b.innerHTML = PTE.icon('mic'); $('#st').textContent = '现在复述，说完点下面的按钮';
        $('#fb').innerHTML = `<button class="pri" id="rev">${PTE.icon('eye')} 对照原文</button>`;
        $('#rev').onclick = () => {
          $('#fb').innerHTML = `<p style="font-size:1.15rem;font-weight:600">${PTE.esc(it.text)}</p><p class="small mute">${PTE.esc(it.cn)}</p><p class="small">你复述出了多少？</p><div class="choice" style="justify-content:center">${[[1, '全部'], [0.75, '大部分'], [0.5, '一半'], [0.2, '很少']].map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>`;
          document.querySelectorAll('[data-v]').forEach(x => x.onclick = () => { const tot = PTE.tokens(it.text).length; PTE.updateStats(s => s.rs.push({ text: it.text, answer: '(自评)', score: Math.round(+x.dataset.v * tot), total: tot })); goalCheck('rs', day.drills.rs); i++; show(); });
        };
      }
    };
  };
  const finish = (it, said) => {
    const r = PTE.wordScore(it.text, said);
    PTE.updateStats(s => s.rs.push({ text: it.text, answer: said, score: r.score, total: r.total }));
    $('#st').textContent = ''; $('#live').textContent = '';
    $('#go').innerHTML = PTE.icon('redo'); $('#go').onclick = () => { show(); };
    $('#fb').innerHTML = scoreBlock(r, `<p class="small mute">${PTE.esc(it.cn)}</p><div class="row" style="justify-content:center"><button class="sm" id="again">${PTE.icon('vol')} 再听</button><button class="pri" id="next">下一句 ${PTE.icon('arrow')}</button></div>`);
    paint(el, r.score / r.total);
    PTE.clickable($('#fb .diff'));
    $('#again').onclick = () => PTE.speak(it.text);
    $('#next').onclick = () => { i++; show(); };
    goalCheck('rs', day.drills.rs);
  };
  show();
}

/* ---------- RA ---------- */
function ra(el) {
  let i = PTE.stats().ra.length % paras.length, timer;
  const show = () => {
    clearInterval(timer);
    const it = paras[i % paras.length];
    el.innerHTML = `<div class="card">${dots('ra', day.drills.ra)}
      <div class="row" style="margin:14px 0 6px"><span class="chip">${PTE.icon('book')} ${PTE.esc(it.title)}</span><span class="grow"></span><button class="sm" id="demo">${PTE.icon('vol')} 示范</button><button class="sm ghost" id="nextp">换一段 ${PTE.icon('arrow')}</button></div>
      <div class="article" id="txt" style="font-size:1.12rem">${PTE.esc(it.text)}</div>
      <div class="stage" style="padding:12px 0 0"><div class="timerbig" id="clock">35</div><div class="small mute" id="phase">准备时间</div>
      <button class="bigbtn" id="skip" style="margin-top:12px" aria-label="开始朗读">${PTE.icon('mic')}</button><div class="small mute" style="margin-top:6px">准备好了就点，开始朗读</div>
      <div id="live" class="mute small" style="margin-top:8px"></div><div id="fb"></div><div style="margin-top:14px">${tips('ra')}</div></div></div>`;
    wireTips(el);
    PTE.clickable($('#txt'));
    let t = 35;
    clearInterval(PTE._raTimer);
    timer = PTE._raTimer = setInterval(() => { if (!$('#clock')) return clearInterval(timer); t--; $('#clock').textContent = t; if (t <= 0) start(); }, 1000);
    $('#skip').onclick = start;
    $('#demo').onclick = () => PTE.speak(it.text);
    $('#nextp').onclick = () => { i++; show(); };
    let started = false;
    async function start() {
      if (started) return; started = true; clearInterval(timer); speechSynthesis.cancel();
      const b = $('#skip'); b.classList.add('rec'); b.disabled = true; b.nextElementSibling.textContent = '';
      let r = 40; $('#clock').textContent = r; $('#phase').innerHTML = '<span class="bad">录音中</span>';
      timer = PTE._raTimer = setInterval(() => { if (!$('#clock')) return clearInterval(timer); r--; $('#clock').textContent = Math.max(r, 0); if (r <= 0) { clearInterval(timer); PTE._stopListen && PTE._stopListen(); } }, 1000);
      if (!PTE.canRecognize) {
        $('#fb').innerHTML = `<p class="small">读完了吗？给自己的流利度打个分：</p><div class="choice" style="justify-content:center">${[[1, '一气呵成'], [0.8, '偶尔卡顿'], [0.5, '多次停顿']].map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>`;
        document.querySelectorAll('[data-v]').forEach(x => x.onclick = () => { clearInterval(timer); const tot = PTE.tokens(it.text).length; PTE.updateStats(s => s.ra.push({ text: it.text.slice(0, 40) + '…', answer: '(自评)', score: Math.round(+x.dataset.v * tot), total: tot })); goalCheck('ra', day.drills.ra); i++; show(); });
        return;
      }
      const said = await PTE.listen(40000, x => $('#live').textContent = x);
      clearInterval(timer); b.classList.remove('rec'); $('#phase').textContent = '完成';
      const res = PTE.wordScore(it.text, said || '');
      PTE.updateStats(s => s.ra.push({ text: it.text.slice(0, 40) + '…', answer: '', score: res.score, total: res.total }));
      $('#txt').innerHTML = diffHTML(res); $('#live').textContent = '';
      $('#fb').innerHTML = `<div class="pulse-in"><div class="scorering">${PTE.ring(res.score / res.total, 88, 8, Math.round(res.score / res.total * 100) + '%')}</div><p class="small mute">红色的词没被识别出来：可能读漏了、吞音了或发音不清。先听示范，再重读一遍。</p><div class="row" style="justify-content:center"><button id="again">${PTE.icon('redo')} 再读一遍</button><button class="pri" id="nx">下一段 ${PTE.icon('arrow')}</button></div></div>`;
      paint(el, res.score / res.total);
      $('#again').onclick = () => show(); $('#nx').onclick = () => { i++; show(); };
      goalCheck('ra', day.drills.ra);
    }
  };
  show();
}

/* ---------- Writing ---------- */
function write(el) {
  const W = day.writing;
  el.innerHTML = Object.entries(W).map(([k, w]) => `<div class="card" data-k="${k}">
    <div class="row"><span class="chip" style="background:${k === 'we' ? '#FFE9E2' : '#EFEAFF'};color:${k === 'we' ? '#D9542F' : '#6C5CFF'}">${PTE.icon('pen')} ${k.toUpperCase()}</span><b class="grow">${PTE.esc(w.title.replace(/^[A-Z]+：/, ''))}</b><span class="timerbig" style="font-size:1.5rem" data-clock>${w.mins}:00</span></div>
    <p style="background:var(--bg);border-radius:14px;padding:12px 14px;margin:12px 0">${PTE.esc(w.prompt)}</p>
    <textarea data-txt spellcheck="false" style="min-height:${k === 'we' ? 280 : 110}px" placeholder="点击“开始计时”后作答（考试界面没有拼写检查）"></textarea>
    <div class="row" style="margin-top:10px"><button class="pri" data-start>${PTE.icon('clock')} 开始计时</button><span class="chip" data-wc>0 词</span><span class="grow"></span><a class="btn sm ghost" href="guide.html#tpl">模板</a><button data-save>${PTE.icon('check')} 提交</button></div>
    <div data-fb style="margin-top:10px"></div></div>`).join('');
  el.querySelectorAll('[data-k]').forEach(card => {
    const w = W[card.dataset.k]; const ta = card.querySelector('[data-txt]'); let left = w.mins * 60, tm, t0;
    const wc = () => (ta.value.match(/[A-Za-z0-9'’-]+/g) || []).length;
    const range = card.dataset.k === 'swt' ? [5, 75] : [200, 300];
    ta.oninput = () => { const n = wc(); const c = card.querySelector('[data-wc]'); c.textContent = n + ' 词'; c.style.background = n >= range[0] && n <= range[1] ? 'var(--okbg)' : ''; c.style.color = n >= range[0] && n <= range[1] ? 'var(--ok)' : ''; };
    card.querySelector('[data-start]').onclick = (ev) => { ev.currentTarget.disabled = true; t0 = Date.now(); ta.focus(); tm = setInterval(() => { left--; const v = Math.max(left, 0); const c = card.querySelector('[data-clock]'); c.textContent = `${Math.floor(v / 60)}:${String(v % 60).padStart(2, '0')}`; c.style.color = v < 60 ? 'var(--bad)' : ''; if (left === 0) PTE.toast('时间到'); }, 1000); };
    card.querySelector('[data-save]').onclick = () => {
      clearInterval(tm); const n = wc(); const mins = t0 ? Math.round((Date.now() - t0) / 60000) : 0;
      const type = card.dataset.k.toUpperCase();
      PTE.updateStats(s => { s.writing = s.writing.filter(x => x.type !== type); s.writing.push({ type, words: n, mins, text: ta.value.trim() }); });
      const checks = type === 'SWT'
        ? [[n >= 5 && n <= 75, `5–75 词（${n}）`], [(ta.value.trim().match(/[.!?](\s|$)/g) || []).length === 1, '只有一个句子'], [/\b(and|while|which|whereas|although)\b/i.test(ta.value), '有连接词']]
        : [[n >= 200 && n <= 300, `200–300 词（${n}）`], [(ta.value.match(/\n/g) || []).length >= 3, '至少 4 段'], [/\b(however|moreover|therefore|for example|in conclusion)\b/i.test(ta.value), '有过渡词']];
      card.querySelector('[data-fb]').innerHTML = '<div class="row">' + checks.map(([ok, t]) => `<span class="chip" style="background:${ok ? 'var(--okbg)' : 'var(--badbg)'};color:${ok ? 'var(--ok)' : 'var(--bad)'}">${PTE.icon(ok ? 'check' : 'x')} ${t}</span>`).join('') + '</div><p class="small mute">已保存，生成汇报时会附上全文，由教练批改。</p>';
      if (checks.every(c => c[0])) PTE.confetti();
    };
  });
}

/* ---------- voice settings ---------- */
document.getElementById('cfg').onclick = () => PTE.voiceSheet(PTE.canRecognize ? '语音识别可用：录音由浏览器发到它的识别服务转成文字，本网站不保存录音。识别结果只能粗略反映内容和清晰度，不等于官方评分。' : '当前浏览器不支持语音识别，RS / RA 会改成自评。建议用电脑上的 Chrome 或 Edge。');
</script>
</body>
</html>
